<svg xmlns="http://www.w3.org/2000/svg" width="132" height="26" viewBox="0 0 132 26" role="img" aria-label="Starts Nov 26">
  <title>Starts Nov 26</title>
  <style>
    .ring { transform-origin: 15px 13px; animation: ping 1.6s ease-out infinite; }
    .dot { animation: blink 1.6s ease-in-out infinite; }
    .text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c2410c; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .ring, .dot { animation: none; } .ring { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="131" height="25" rx="12.5" fill="#fff7ed" stroke="#f97316"/>
  <circle class="ring" cx="15" cy="13" r="4" fill="#f97316"/>
  <circle class="dot" cx="15" cy="13" r="4" fill="#f97316"/>
  <text class="text" x="27" y="17.2">Starts Nov 26</text>
</svg>
